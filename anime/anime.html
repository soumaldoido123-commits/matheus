<!doctype html><body style="margin:0;background:#000"><svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"></svg><script>
const S=document.getElementById('s'),P=Math.PI,sin=Math.sin,cos=Math.cos,m=(a,b)=>((a%b)+b)%b;
function mtn(w,h,c,y){let d=`M0 ${y}`;for(let x=0;x<=1280;x+=w)d+=`L${x+w/2} ${y-h*(1+.4*sin(x))}L${x+w} ${y}`;return `<path d="${d}V360H0Z" fill="${c}"/>`}
function tree(x){return `<rect x="${x-4}" y="210" width="8" height="50" fill="#5B3A45"/><circle cx="${x}" cy="200" r="30" fill="#F7A8C4"/><circle cx="${x-18}" cy="212" r="20" fill="#F29AB8"/><circle cx="${x+18}" cy="210" r="22" fill="#FBC3D6"/>`}
function leg(a,k,c){return `<g transform="rotate(${a})"><line x1="0" y1="0" x2="0" y2="42" stroke="#F6D5C3" stroke-width="11" stroke-linecap="round"/><g transform="translate(0 42) rotate(${k})"><line x1="0" y1="0" x2="0" y2="38" stroke="${c}" stroke-width="10" stroke-linecap="round"/><ellipse cx="7" cy="42" rx="11" ry="5" fill="#3A2A2A"/></g></g>`}
function arm(a,c){return `<g transform="translate(0 -58) rotate(${a})"><line x1="0" y1="0" x2="0" y2="20" stroke="${c}" stroke-width="13" stroke-linecap="round"/><line x1="0" y1="18" x2="4" y2="38" stroke="#F6D5C3" stroke-width="8" stroke-linecap="round"/><circle cx="5" cy="41" r="5" fill="#F6D5C3"/></g>`}
function R(t){t=Math.floor(t*12)/12;const p=2*P*t,b=-4*Math.abs(cos(p)),lag=q=>sin(p-q);
const blink=m(t,3)<.17?.1:1;let o=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A7FDB"/><stop offset=".6" stop-color="#F6B6C8"/><stop offset="1" stop-color="#FFE0C2"/></linearGradient></defs><rect width="640" height="360" fill="url(#sk)"/><circle cx="480" cy="110" r="46" fill="#FFF3D6" opacity=".9"/>`;
o+=`<g transform="translate(${-m(t*80,640)} 0)">${mtn(160,70,'#9A8FD6',230)}</g>`;
o+=`<g transform="translate(${-m(t*160,640)} 0)">${mtn(90,40,'#C79BD8',255)}</g>`;
let tr='';for(let x=60;x<1280;x+=213.3)tr+=tree(x);o+=`<g transform="translate(${-m(t*240,640)} 0)">${tr}</g>`;
o+=`<rect y="258" width="640" height="102" fill="#8FC68A"/><rect y="296" width="640" height="64" fill="#D9C3A0"/>`;
let gl='';for(let x=0;x<1280;x+=40)gl+=`<line x1="${x}" y1="300" x2="${x+18}" y2="300" stroke="#C4AC86" stroke-width="3"/><line x1="${x+20}" y1="330" x2="${x+44}" y2="330" stroke="#C4AC86" stroke-width="3"/>`;o+=`<g transform="translate(${-m(t*320,640)} 0)">${gl}</g>`;
o+=`<ellipse cx="322" cy="302" rx="${30+b}" ry="5" fill="#000" opacity=".18"/>`;
const A=24*sin(p),K=v=>Math.max(0,40*sin(v));
o+=`<g transform="translate(320 ${216+b})">`;
o+=arm(-A*1.1,'#DDE3F2')+`<g transform="translate(0 4)">${leg(-A,K(p+P+.6),'#F6D5C3')}</g>`;
o+=`<g transform="rotate(${3+b*.3})"><path d="M-13-70Q0-76 13-70L15 0H-15Z" fill="#F4F6FB"/><path d="M-15-72L14-72L20-56L-2-48Z" fill="#2B3A67"/>`;
o+=`<g transform="translate(10 -56) rotate(${10*lag(.9)})"><path d="M0 0L14 20L4 22Z M0 0L8 24L-2 22Z" fill="#E0414F"/></g>`;
o+=`<path d="M-18-4H18L${26+3*lag(.7)} 22H${-26+3*lag(.7)}Z" fill="#2B3A67"/><path d="M-8-4L${-11+2*lag(.7)} 22M6-4L${8+2*lag(.7)} 22" stroke="#1D2850" stroke-width="2"/></g>`;
o+=`<g transform="translate(0 4)">${leg(A,K(p+.6),'#F6D5C3')}</g>`+arm(A*1.1,'#DDE3F2');
o+=`<g transform="translate(4 -98) rotate(${1.5*sin(2*p)})">`;
o+=`<g transform="translate(-20 -14) rotate(${-8+14*lag(1.1)})"><path d="M0 0C-30 6-36 40-26 62C-18 40-12 20 6 10Z" fill="#4A3A7A"/></g>`;
o+=`<path d="M-26 6C-30-26 26-34 28-4L26 22C10 28-18 28-24 18Z" fill="#4A3A7A"/><circle cx="3" cy="4" r="24" fill="#FBE3D6"/>`;
o+=`<path d="M-22-6C-18-30 24-34 30-8C22-18 16-4 10-14C6-4-4-6-6-14C-10-4-18-4-22-6Z" fill="#4A3A7A"/>`;
o+=`<g transform="translate(15 4) scale(1 ${blink})"><ellipse rx="5.5" ry="8.5" fill="#3E2E73"/><ellipse cy="3" rx="4" ry="4.5" fill="#8C6BE0"/><circle cx="-1.5" cy="-3.5" r="2.4" fill="#fff"/><circle cx="2" cy="3" r="1" fill="#fff"/></g>`;
o+=`<path d="M9-8L21-10" stroke="#3E2E73" stroke-width="2" stroke-linecap="round"/><ellipse cx="14" cy="14" rx="5" ry="2.5" fill="#F4A3B4" opacity=".7"/><path d="M20 19Q23 21 25 19" stroke="#A0525E" stroke-width="1.5" fill="none"/>`;
o+=`<circle cx="-14" cy="-16" r="4" fill="#E0414F"/></g></g>`;
for(let i=0;i<22;i++){const x=m(i*97-80*t+40*sin(t*P/2+i),700)-30,y=m(i*53+45*t,380)-10;o+=`<ellipse cx="${x}" cy="${y}" rx="4" ry="2.4" fill="#FFC6D9" transform="rotate(${m(i*40+90*t,360)} ${x} ${y})"/>`}
S.innerHTML=o}
R(0);</script>
